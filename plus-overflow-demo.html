<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>&#21152;&#21495;&#25353;&#38062;&#28322;&#20986; Demo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f6f8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #111827; }
    .page { width: 390px; min-height: 100vh; margin: 0 auto; padding: 28px 12px; background: #f6f7f9; }
    .title { margin: 0 0 14px; font-size: 18px; font-weight: 800; }
    .note { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #6b7280; }
    .label { margin: 0 0 8px; font-size: 13px; font-weight: 800; color: #374151; }
    .card { display: flex; gap: 12px; width: 100%; margin-bottom: 18px; padding: 14px 8px 14px 14px; border-radius: 14px; background: #fff; overflow: hidden; box-shadow: 0 6px 18px rgba(15, 23, 42, .06); }
    .thumb { width: 112px; height: 112px; flex: 0 0 112px; border-radius: 12px; background: #f3f1ec; }
    .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .name { font-size: 19px; font-weight: 850; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .desc { margin-top: 8px; color: #8a8f98; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bottom { margin-top: auto; display: flex; align-items: flex-end; justify-content: space-between; min-width: 0; }
    .price { color: #07c160; font-size: 26px; font-weight: 900; }
    .counter-wrap { margin-left: 8px; flex: 0 0 auto; display: flex; justify-content: flex-end; outline: 1px dashed rgba(239, 68, 68, .45); }
    .counter { display: flex; align-items: center; justify-content: space-between; background: #f1f2f4; }
    .touch { display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
    .btn { border-radius: 50%; display: grid; place-items: center; font-size: 18px; font-weight: 900; line-height: 1; }
    .minus { background: #e5e7eb; color: #4b5563; }
    .plus { background: #07c160; color: #fff; }
    .num { width: 22px; min-width: 22px; text-align: center; font-size: 17px; font-weight: 800; }

    .bad .counter-wrap { width: 108px; max-width: 108px; overflow: hidden; }
    .bad .counter { width: 108px; height: 34px; border-radius: 17px; padding: 0 2px; gap: 3px; overflow: visible; }
    .bad .touch { width: 36px; height: 36px; }
    .bad .btn { width: 32px; height: 32px; }
    .bad .plus { transform: scale(1.14); transform-origin: center; }

    .good .card { padding-right: 14px; }
    .good .counter-wrap { width: 120px; max-width: 120px; overflow: visible; }
    .good .counter { width: 116px; height: 36px; border-radius: 18px; padding: 2px; gap: 3px; overflow: hidden; }
    .good .touch { width: 32px; height: 32px; }
    .good .btn { width: 32px; height: 32px; }
    .good .plus { transform: scale(1); transform-origin: center; }
  </style>
</head>
<body>
  <main class="page">
    <h1 class="title">&#21152;&#21495;&#25353;&#38062;&#28322;&#20986;&#23545;&#27604;</h1>
    <p class="note">&#24038;&#20391;&#22797;&#29616;&#65306;&#20943;&#21495;&#30340;&#35302;&#25720;&#21306;&#27604;&#32966;&#22218;&#26356;&#39640;&#65292;&#24038;&#36793;&#20250;&#20984;&#20986;&#12290;&#21491;&#20391;&#26041;&#26696;&#65306;&#25226; - 1 + &#24403;&#25104;&#19968;&#20010;&#23436;&#25972;&#32966;&#22218;&#25511;&#20214;&#65292;&#25152;&#26377;&#20803;&#32032;&#37117;&#22312;&#32966;&#22218;&#20869;&#12290;</p>

    <section class="bad">
      <p class="label">&#24403;&#21069;&#38382;&#39064;</p>
      <div class="card"><div class="thumb"></div><div class="info"><div class="name">&#34507;&#28818;&#39277;</div><div class="desc">&#31890;&#31890;&#20998;&#26126;&#65292;&#34507;&#39321;&#27987;&#37057;</div><div class="bottom"><div class="price">&yen;14</div><div class="counter-wrap"><div class="counter"><div class="touch"><div class="btn minus">-</div></div><div class="num">1</div><div class="touch"><div class="btn plus">+</div></div></div></div></div></div></div>
    </section>

    <section class="good">
      <p class="label">&#20462;&#22797;&#26041;&#26696;</p>
      <div class="card"><div class="thumb"></div><div class="info"><div class="name">&#34507;&#28818;&#39277;</div><div class="desc">&#31890;&#31890;&#20998;&#26126;&#65292;&#34507;&#39321;&#27987;&#37057;</div><div class="bottom"><div class="price">&yen;14</div><div class="counter-wrap"><div class="counter"><div class="touch"><div class="btn minus">-</div></div><div class="num">1</div><div class="touch"><div class="btn plus">+</div></div></div></div></div></div></div>
    </section>
  </main>
</body>
</html>
