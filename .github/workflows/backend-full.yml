name: Backend Full Certification

# TEST-INFRA-01: authoritative, serial migration of the local Backend Full run
# (`python -m pytest tests/ -q -W error::RuntimeWarning`, ~60-70min) to CI.
# Manual trigger only in this first version, to avoid burning Actions minutes
# on every push. No -x / --lf / xdist / sharding — see TEST-INFRA-03 for that.
#
# The workflow DEFINITION always comes from whatever ref you dispatch it from
# (normally main) — that's inherent to workflow_dispatch. The CODE actually
# tested is `target_ref`, checked out explicitly below, so candidate feature
# branches never need to carry this file themselves. WORKFLOW_SHA (the
# definition) and TARGET_HEAD_SHA (the code under test) are logged separately;
# TARGET_HEAD_SHA is the certification authority.
on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Branch, tag, or commit SHA to certify'
        required: true
        default: 'main'

concurrency:
  group: backend-full-${{ inputs.target_ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: saas-base
    shell: bash

jobs:
  full:
    name: Backend Full (serial, authoritative)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    # Test suite is self-contained (aiosqlite in-memory DB); no test connects to a
    # real MySQL/Redis host, so no service containers are needed here.
    #
    # JWT_SECRET_KEY: app/config.py's Settings.model_post_init raises RuntimeError
    # if this is left at its class-default placeholder value. Locally this is
    # overridden by a real value in saas-base/.env, but .env is gitignored and does
    # not exist on a CI checkout (verified: import fails without it). The value
    # below is a CI-only dummy signing key with no relation to any real secret —
    # tokens signed with it never leave this ephemeral job.
    env:
      REDIS_ENABLED: 'false'
      JWT_SECRET_KEY: 'ci-only-dummy-signing-key-not-a-real-secret-0123456789abcdef'

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Identity proof
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          echo "WORKFLOW_REF=${GITHUB_REF}"
          echo "WORKFLOW_SHA=${GITHUB_SHA}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "TARGET_HEAD_SHA=$(git rev-parse HEAD)"
          echo "TARGET_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "--- git status --porcelain (must be empty) ---"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout of target_ref is not clean"
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            saas-base/requirements.txt
            saas-base/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Collect (inventory + fail-fast gate)
        run: |
          set -o pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect-output.log

      - name: Backend authoritative Full
        run: |
          set -o pipefail
          python -m pytest tests/ -q -W error::RuntimeWarning 2>&1 | tee full-output.log

      - name: Write certification metadata
        if: always()
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          {
            echo "WORKFLOW_SHA=${GITHUB_SHA}"
            echo "TARGET_REF=${TARGET_REF}"
            echo "TARGET_HEAD_SHA=$(git rev-parse HEAD)"
            echo "TARGET_TREE_SHA=$(git rev-parse HEAD^{tree})"
            echo "COLLECT_COMMAND=python -m pytest tests/ --collect-only -q"
            echo "FULL_COMMAND=python -m pytest tests/ -q -W error::RuntimeWarning"
          } > certification-metadata.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-full-logs-${{ github.run_id }}
          path: |
            saas-base/collect-output.log
            saas-base/full-output.log
            saas-base/certification-metadata.txt
          retention-days: 14
