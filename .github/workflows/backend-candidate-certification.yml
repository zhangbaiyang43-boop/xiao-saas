name: Backend Candidate Certification

# TEST-INFRA-02: parallel migration of the local Gate A + Gate B sweep
# (~40+ min serial locally) to CI, alongside -- not replacing -- the existing
# Backend Full Certification workflow (backend-full.yml, unmodified). This
# workflow gives fast (minutes, not an hour) signal on a P0 candidate's own
# new/changed tests (Gate A) and the fixed cross-P0 regression profile
# (Gate B), in parallel with a full serial run, so a candidate can be
# certified without waiting on Full's ~60-70min authority every time.
#
# Same TEST-INFRA-01 identity model: workflow_dispatch tests target_ref, while
# pull_request tests GitHub's proposed merge ref against the current main.
# Every job records the checked-out SHA; PR head/base identity is recorded
# separately so a merge-ref result can never be mistaken for the feature SHA.
#
# CI infrastructure (this file, the Gate B manifest, the path-validation
# helper) always comes from whatever ref dispatched the workflow -- a P0
# candidate branch never needs to carry any of it. See the "infra checkout"
# steps in gate-a/gate-b below.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - 'saas-base/**'
      - '.github/workflows/backend-candidate-certification.yml'
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Exact branch/tag/40-char commit SHA to certify'
        required: true
        default: 'main'

permissions:
  contents: read

concurrency:
  group: backend-candidate-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || inputs.target_ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CERT_EVENT: ${{ github.event_name }}
  TARGET_REF: ${{ github.event_name == 'pull_request' && github.ref || inputs.target_ref }}
  PR_HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || '' }}
  PR_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
  REDIS_ENABLED: 'false'
  # CI-only dummy signing key, unrelated to any real secret -- see
  # backend-full.yml's identical comment for why this is required at all
  # (app/config.py's placeholder-value guard has no .env to read from on a
  # fresh CI checkout).
  JWT_SECRET_KEY: 'ci-only-dummy-signing-key-not-a-real-secret-0123456789abcdef'

jobs:
  gate-a:
    name: Gate A (candidate's own new/changed backend tests)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pr_identity_gate: ${{ steps.pr_identity.outputs.result }}
      authority_changed: ${{ steps.authority_changed.outputs.result }}
    steps:
      - name: Checkout target ref (candidate under test)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_REF }}
          path: target
          fetch-depth: 2 # need HEAD^ for the Gate A diff base

      - name: Checkout CI infra ref (manifest + helper script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: infra

      - name: Identity proof
        id: identity
        working-directory: target/saas-base
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CERT_EVENT=${CERT_EVENT}"
          echo "WORKFLOW_REF=${GITHUB_REF}"
          echo "WORKFLOW_SHA=${GITHUB_SHA}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
          echo "PR_BASE_SHA=${PR_BASE_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_HEAD_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "checked_out_sha=${CHECKED_OUT_SHA}" >> "$GITHUB_OUTPUT"
          echo "--- git status --porcelain (must be empty) ---"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout of target_ref is not clean"
            exit 1
          fi
          if ! git rev-parse HEAD^ >/dev/null 2>&1; then
            echo "FAIL: target_ref has no parent commit (root commit) -- Gate A diff base unavailable"
            exit 1
          fi

      - name: PR merge-ref identity gate
        id: pr_identity
        working-directory: target
        run: bash "${{ github.workspace }}/infra/.github/scripts/verify_certification_identity.sh"

      - name: Detect PR changes to CI authority files
        id: authority_changed
        if: ${{ env.CERT_EVENT == 'pull_request' }}
        working-directory: target
        run: |
          # A pull_request run executes the workflow and scripts from the PR's own
          # merge commit. If the PR changes any of them it is certifying itself, so
          # the summary fails closed and the change needs manual bootstrap review.
          if git diff --quiet HEAD^1 HEAD -- .github/workflows/backend-candidate-certification.yml .github/scripts; then
            echo "result=NO" >> "$GITHUB_OUTPUT"
          else
            echo "result=YES" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            target/saas-base/requirements.txt
            target/saas-base/requirements-dev.txt

      - name: Install dependencies
        working-directory: target/saas-base
        run: pip install -r requirements-dev.txt

      - name: Fail closed on deleted backend test files
        working-directory: target/saas-base
        run: |
          set -o pipefail
          # A candidate must never be able to make Gate A/Gate B/Full "pass"
          # by deleting an inconvenient test rather than fixing the code.
          # --diff-filter=D isolates deletions specifically (separate from
          # the ACMR discovery step below, which deliberately excludes D so
          # a deleted file never gets passed to pytest as a nonexistent
          # path). Same repo-root-relative-output caveat as the ACMR step.
          git diff --name-only --diff-filter=D HEAD^ HEAD -- 'tests/*.py' \
            | sed 's|^saas-base/||' > deleted-tests.txt || true
          if [ -s deleted-tests.txt ]; then
            echo "DELETED_BACKEND_TESTS_NOT_ALLOWED"
            echo "This candidate commit deletes the following saas-base/tests/*.py file(s):"
            cat deleted-tests.txt
            exit 1
          fi
          echo "No backend test files deleted by this candidate commit."

      - name: Discover changed backend test files
        working-directory: target/saas-base
        run: |
          set -o pipefail
          # workflow_dispatch preserves the existing one-final-commit
          # candidate contract, where HEAD^ is the previously certified base.
          # For pull_request, HEAD is GitHub's proposed merge commit and HEAD^
          # is its first parent (the current base), so this same diff covers
          # the complete feature PR without changing Gate A's test selection.
          #
          # The pathspec below is relative to cwd (target/saas-base), which is
          # correct as-is. But git diff --name-only always PRINTS paths
          # relative to the repo ROOT (target/), regardless of cwd or the
          # pathspec used -- so the output needs "saas-base/" stripped to
          # match the saas-base-relative "tests/xxx.py" format the
          # validator/manifest both use. Confirmed by a dry-run against a
          # real candidate commit; without the strip every path would be
          # "saas-base/tests/xxx.py" and rejected as not matching ^tests/...
          git diff --name-only --diff-filter=ACMR HEAD^ HEAD -- 'tests/*.py' \
            | sed 's|^saas-base/||' > gate-a-files.txt || true
          echo "GATE_A_CHANGED_FILES="
          cat gate-a-files.txt

      - name: Validate + run Gate A
        working-directory: target/saas-base
        run: |
          set -o pipefail
          if [ ! -s gate-a-files.txt ]; then
            echo "NO_CHANGED_BACKEND_TESTS"
            echo "Gate A requires this candidate to add/modify at least one saas-base/tests/*.py file."
            exit 1
          fi
          python "${{ github.workspace }}/infra/saas-base/scripts/ci_backend_gate_runner.py" \
            --repo-root "${{ github.workspace }}/target/saas-base" \
            --paths-file gate-a-files.txt \
            run 2>&1 | tee gate-a-output.log

      - name: Upload Gate A logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-gate-a-${{ github.run_id }}
          path: |
            target/saas-base/deleted-tests.txt
            target/saas-base/gate-a-files.txt
            target/saas-base/gate-a-output.log
          retention-days: 14
          if-no-files-found: ignore

  gate-b:
    name: Gate B (cumulative P0 contracts + static core regression)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pr_identity_gate: ${{ steps.pr_identity.outputs.result }}
    steps:
      - name: Checkout target ref (candidate under test)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_REF }}
          path: target

      - name: Checkout CI infra ref (manifest + helper script)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: infra

      - name: Identity proof
        id: identity
        working-directory: target/saas-base
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CERT_EVENT=${CERT_EVENT}"
          echo "WORKFLOW_REF=${GITHUB_REF}"
          echo "WORKFLOW_SHA=${GITHUB_SHA}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
          echo "PR_BASE_SHA=${PR_BASE_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_HEAD_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "checked_out_sha=${CHECKED_OUT_SHA}" >> "$GITHUB_OUTPUT"
          echo "--- git status --porcelain (must be empty) ---"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout of target_ref is not clean"
            exit 1
          fi

      - name: PR merge-ref identity gate
        id: pr_identity
        working-directory: target
        run: bash "${{ github.workspace }}/infra/.github/scripts/verify_certification_identity.sh"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            target/saas-base/requirements.txt
            target/saas-base/requirements-dev.txt

      - name: Install dependencies
        working-directory: target/saas-base
        run: pip install -r requirements-dev.txt

      - name: Discover all P0 test files (tracked-only, cumulative)
        working-directory: target/saas-base
        run: |
          set -o pipefail
          # git ls-files only lists files git itself tracks in THIS checkout
          # -- no working-tree/untracked-file injection risk, unlike a raw
          # filesystem glob. Cumulative by design and requiring no manual
          # manifest upkeep per P0: a P0-14 candidate automatically picks up
          # every test_p0_*.py already merged into target_ref's history
          # (P0-01..P0-13), a P0-15 candidate automatically picks up
          # P0-01..P0-14, and so on. Unlike git diff, ls-files output is
          # already relative to cwd -- confirmed by a dry-run, no prefix
          # stripping needed here.
          git ls-files 'tests/test_p0_*.py' > gate-b-p0-files.txt
          echo "GATE_B_AUTO_DISCOVERED_P0_FILES="
          cat gate-b-p0-files.txt

      - name: Combine with static core regression manifest
        working-directory: target/saas-base
        run: |
          set -o pipefail
          # backend-gate-b.txt (from the infra checkout) is the NON-P0 core
          # regression profile only -- P0 coverage comes entirely from the
          # auto-discovery step above. Concatenate + dedupe; comments/blanks
          # in either source are harmless no-ops for the validator.
          cat gate-b-p0-files.txt "${{ github.workspace }}/infra/saas-base/ci/backend-gate-b.txt" \
            | sort -u > gate-b-combined.txt
          echo "GATE_B_COMBINED_FILES="
          cat gate-b-combined.txt

      - name: Validate + run Gate B
        working-directory: target/saas-base
        run: |
          set -o pipefail
          python "${{ github.workspace }}/infra/saas-base/scripts/ci_backend_gate_runner.py" \
            --repo-root "${{ github.workspace }}/target/saas-base" \
            --paths-file gate-b-combined.txt \
            run 2>&1 | tee gate-b-output.log \
          || { echo "GATE_B_MANIFEST_INVALID_OR_FAILED"; exit 1; }

      - name: Upload Gate B logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-gate-b-${{ github.run_id }}
          path: |
            infra/saas-base/ci/backend-gate-b.txt
            target/saas-base/gate-b-p0-files.txt
            target/saas-base/gate-b-combined.txt
            target/saas-base/gate-b-output.log
          retention-days: 14
          if-no-files-found: ignore

  full:
    name: Backend Full (serial, authoritative -- same semantics as backend-full.yml)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pr_identity_gate: ${{ steps.pr_identity.outputs.result }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_REF }}

      - name: Identity proof
        id: identity
        working-directory: saas-base
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CERT_EVENT=${CERT_EVENT}"
          echo "WORKFLOW_REF=${GITHUB_REF}"
          echo "WORKFLOW_SHA=${GITHUB_SHA}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
          echo "PR_BASE_SHA=${PR_BASE_SHA}"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_HEAD_SHA=${CHECKED_OUT_SHA}"
          echo "TARGET_TREE_SHA=$(git rev-parse HEAD^{tree})"
          echo "checked_out_sha=${CHECKED_OUT_SHA}" >> "$GITHUB_OUTPUT"
          echo "--- git status --porcelain (must be empty) ---"
          git status --porcelain
          if [ -n "$(git status --porcelain)" ]; then
            echo "FAIL: checkout of target_ref is not clean"
            exit 1
          fi

      - name: PR merge-ref identity gate
        id: pr_identity
        working-directory: ${{ github.workspace }}
        run: bash "${{ github.workspace }}/.github/scripts/verify_certification_identity.sh"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            saas-base/requirements.txt
            saas-base/requirements-dev.txt

      - name: Install dependencies
        working-directory: saas-base
        run: pip install -r requirements-dev.txt

      - name: Collect (inventory + fail-fast gate)
        working-directory: saas-base
        run: |
          set -o pipefail
          python -m pytest tests/ --collect-only -q 2>&1 | tee collect-output.log

      - name: Backend authoritative Full
        working-directory: saas-base
        run: |
          set -o pipefail
          python -m pytest tests/ -q -W error::RuntimeWarning 2>&1 | tee full-output.log

      - name: Upload Full logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-full-${{ github.run_id }}
          path: |
            saas-base/collect-output.log
            saas-base/full-output.log
          retention-days: 14
          if-no-files-found: ignore

  mysql-schema:
    name: MySQL 5.7 schema convergence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pr_identity_gate: ${{ steps.pr_identity.outputs.result }}
      activation: ${{ steps.activation.outputs.result }}
    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      REDIS_ENABLED: 'false'
      JWT_SECRET_KEY: 'ci-only-dummy-signing-key-not-a-real-secret-0123456789abcdef'
      WXPAY_SCHEMA_TEST_DATABASE_URL: 'mysql+asyncmy://root:root@127.0.0.1:3306/mysql?charset=utf8mb4'
    steps:
      - name: Checkout target ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 2 # merge-commit parents are needed for the identity + activation diff

      - name: Identity proof
        id: identity
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "checked_out_sha=${CHECKED_OUT_SHA}" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: PR merge-ref identity gate
        id: pr_identity
        working-directory: ${{ github.workspace }}
        run: bash "${{ github.workspace }}/.github/scripts/verify_certification_identity.sh"

      - name: Resolve activation base
        id: activation_base
        run: |
          if [ "$CERT_EVENT" = "pull_request" ]; then
            echo "sha=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin main
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve MySQL gate activation
        id: activation
        env:
          ACTIVATION_BASE_SHA: ${{ steps.activation_base.outputs.sha }}
        run: bash "${{ github.workspace }}/.github/scripts/resolve_certification_activation.sh" mysql

      - name: Set up Python
        if: steps.activation.outputs.result == 'ACTIVE'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: saas-base/requirements-dev.txt

      - name: Install dependencies
        if: steps.activation.outputs.result == 'ACTIVE'
        working-directory: saas-base
        run: pip install -r requirements-dev.txt

      - name: Verify Alembic convergence on MySQL 5.7
        if: steps.activation.outputs.result == 'ACTIVE'
        working-directory: saas-base
        run: git ls-files 'tests/test_*_schema_mysql.py' | xargs python -m pytest -q -W error::RuntimeWarning

  keyring-systemd:
    name: Keyring source policy under real systemd
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      checked_out_sha: ${{ steps.identity.outputs.checked_out_sha }}
      pr_identity_gate: ${{ steps.pr_identity.outputs.result }}
      activation: ${{ steps.activation.outputs.result }}
    steps:
      - name: Checkout target ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 2

      - name: Identity proof
        id: identity
        run: |
          CHECKED_OUT_SHA="$(git rev-parse HEAD)"
          echo "CHECKED_OUT_SHA=${CHECKED_OUT_SHA}"
          echo "checked_out_sha=${CHECKED_OUT_SHA}" >> "$GITHUB_OUTPUT"
          test -z "$(git status --porcelain)"

      - name: PR merge-ref identity gate
        id: pr_identity
        working-directory: ${{ github.workspace }}
        run: bash "${{ github.workspace }}/.github/scripts/verify_certification_identity.sh"

      - name: Resolve activation base
        id: activation_base
        run: |
          if [ "$CERT_EVENT" = "pull_request" ]; then
            echo "sha=${PR_BASE_SHA}" >> "$GITHUB_OUTPUT"
          else
            git fetch --no-tags --depth=1 origin main
            echo "sha=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve systemd gate activation
        id: activation
        env:
          ACTIVATION_BASE_SHA: ${{ steps.activation_base.outputs.sha }}
        run: bash "${{ github.workspace }}/.github/scripts/resolve_certification_activation.sh" systemd

      - name: Set up Python
        if: steps.activation.outputs.result == 'ACTIVE'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: saas-base/requirements-dev.txt

      - name: Install dependencies
        if: steps.activation.outputs.result == 'ACTIVE'
        working-directory: saas-base
        run: pip install -r requirements-dev.txt

      - name: Verify keyring trust policy as root and non-root systemd services
        if: steps.activation.outputs.result == 'ACTIVE'
        run: bash .github/scripts/verify_keyring_systemd.sh saas-base

  certification-summary:
    name: Certification summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gate-a, gate-b, full, mysql-schema, keyring-systemd]
    if: always()
    steps:
      - name: Report candidate certification status
        env:
          GATE_A_RESULT: ${{ needs.gate-a.result }}
          GATE_B_RESULT: ${{ needs.gate-b.result }}
          FULL_RESULT: ${{ needs.full.result }}
          MYSQL_SCHEMA_RESULT: ${{ needs.mysql-schema.result }}
          KEYRING_SYSTEMD_RESULT: ${{ needs.keyring-systemd.result }}
          GATE_A_CHECKED_OUT_SHA: ${{ needs.gate-a.outputs.checked_out_sha }}
          GATE_B_CHECKED_OUT_SHA: ${{ needs.gate-b.outputs.checked_out_sha }}
          FULL_CHECKED_OUT_SHA: ${{ needs.full.outputs.checked_out_sha }}
          MYSQL_SCHEMA_CHECKED_OUT_SHA: ${{ needs.mysql-schema.outputs.checked_out_sha }}
          KEYRING_SYSTEMD_CHECKED_OUT_SHA: ${{ needs.keyring-systemd.outputs.checked_out_sha }}
          GATE_A_IDENTITY: ${{ needs.gate-a.outputs.pr_identity_gate }}
          GATE_B_IDENTITY: ${{ needs.gate-b.outputs.pr_identity_gate }}
          FULL_IDENTITY: ${{ needs.full.outputs.pr_identity_gate }}
          MYSQL_SCHEMA_IDENTITY: ${{ needs.mysql-schema.outputs.pr_identity_gate }}
          KEYRING_SYSTEMD_IDENTITY: ${{ needs.keyring-systemd.outputs.pr_identity_gate }}
          MYSQL_ACTIVATION: ${{ needs.mysql-schema.outputs.activation }}
          SYSTEMD_ACTIVATION: ${{ needs.keyring-systemd.outputs.activation }}
          AUTHORITY_CHANGED_BY_PR: ${{ needs.gate-a.outputs.authority_changed }}
        run: |
          echo "CERT_EVENT=${CERT_EVENT}"
          echo "TARGET_REF=${TARGET_REF}"
          echo "PR_HEAD_SHA=${PR_HEAD_SHA}"
          echo "PR_BASE_SHA=${PR_BASE_SHA}"
          echo "CHECKED_OUT_SHA=${GATE_A_CHECKED_OUT_SHA}"
          echo "GATE_A_CHECKED_OUT_SHA=${GATE_A_CHECKED_OUT_SHA}"
          echo "GATE_B_CHECKED_OUT_SHA=${GATE_B_CHECKED_OUT_SHA}"
          echo "FULL_CHECKED_OUT_SHA=${FULL_CHECKED_OUT_SHA}"
          echo "MYSQL_SCHEMA_CHECKED_OUT_SHA=${MYSQL_SCHEMA_CHECKED_OUT_SHA}"
          echo "KEYRING_SYSTEMD_CHECKED_OUT_SHA=${KEYRING_SYSTEMD_CHECKED_OUT_SHA}"
          echo "GATE_A=${GATE_A_RESULT}"
          echo "GATE_B=${GATE_B_RESULT}"
          echo "FULL=${FULL_RESULT}"
          echo "MYSQL_SCHEMA=${MYSQL_SCHEMA_RESULT}"
          echo "MYSQL_GATE=${MYSQL_SCHEMA_RESULT}"
          echo "KEYRING_SYSTEMD=${KEYRING_SYSTEMD_RESULT}"
          echo "MYSQL_ACTIVATION=${MYSQL_ACTIVATION}"
          echo "SYSTEMD_ACTIVATION=${SYSTEMD_ACTIVATION}"
          FAILED=0

          # 1. Every required job must have succeeded; failure, cancelled and
          #    skipped all fail closed.
          for result in "$GATE_A_RESULT" "$GATE_B_RESULT" "$FULL_RESULT" "$MYSQL_SCHEMA_RESULT" "$KEYRING_SYSTEMD_RESULT"; do
            [ "$result" = "success" ] || FAILED=1
          done

          # 2. All jobs must have certified the same commit.
          if [ -z "$GATE_A_CHECKED_OUT_SHA" ] || \
             [ "$GATE_A_CHECKED_OUT_SHA" != "$GATE_B_CHECKED_OUT_SHA" ] || \
             [ "$GATE_A_CHECKED_OUT_SHA" != "$FULL_CHECKED_OUT_SHA" ] || \
             [ "$GATE_A_CHECKED_OUT_SHA" != "$MYSQL_SCHEMA_CHECKED_OUT_SHA" ] || \
             [ "$GATE_A_CHECKED_OUT_SHA" != "$KEYRING_SYSTEMD_CHECKED_OUT_SHA" ]; then
            echo "CERTIFICATION_CHECKOUT_SHA_MISMATCH"
            FAILED=1
          fi

          # 3. Identity gate: every job must report the result the event demands.
          if [ "$CERT_EVENT" = "pull_request" ]; then
            EXPECTED_IDENTITY=PASS
          else
            EXPECTED_IDENTITY=NOT_APPLICABLE
            echo "PR_MERGE_REF_CERTIFIED=NO"
          fi
          IDENTITY_OK=1
          for gate in "$GATE_A_IDENTITY" "$GATE_B_IDENTITY" "$FULL_IDENTITY" "$MYSQL_SCHEMA_IDENTITY" "$KEYRING_SYSTEMD_IDENTITY"; do
            [ "$gate" = "$EXPECTED_IDENTITY" ] || IDENTITY_OK=0
          done
          if [ "$IDENTITY_OK" -ne 1 ]; then
            echo "PR_IDENTITY_GATE=FAIL"
            FAILED=1
          else
            echo "PR_IDENTITY_GATE=${EXPECTED_IDENTITY}"
          fi

          # 4. Capability gates must report an explicit activation state. A gate
          #    that is not yet active on this baseline is reported, never counted
          #    as verification.
          for activation in "$MYSQL_ACTIVATION" "$SYSTEMD_ACTIVATION"; do
            case "$activation" in
              ACTIVE|BASELINE_NOT_ACTIVE) ;;
              *) FAILED=1 ;;
            esac
          done
          if [ "$MYSQL_ACTIVATION" = "ACTIVE" ] && [ "$SYSTEMD_ACTIVATION" = "ACTIVE" ]; then
            echo "B1_REQUIRED_TESTS_ACTIVE=YES"
          else
            echo "B1_REQUIRED_TESTS_ACTIVE=NO"
          fi

          # 5. A PR must not alter the files that certify it.
          if [ "$CERT_EVENT" = "pull_request" ]; then
            echo "CI_AUTHORITY_CHANGED_BY_PR=${AUTHORITY_CHANGED_BY_PR:-UNKNOWN}"
            if [ "${AUTHORITY_CHANGED_BY_PR:-UNKNOWN}" != "NO" ]; then
              echo "CI_AUTHORITY_CHANGE_REQUIRES_MANUAL_BOOTSTRAP_REVIEW"
              FAILED=1
            fi
          fi

          if [ "$FAILED" -eq 0 ]; then
            echo "CERTIFICATION_SUMMARY=PASS"
            echo "CANDIDATE_CERTIFIED=YES"
          else
            echo "CERTIFICATION_SUMMARY=FAIL"
            echo "CANDIDATE_CERTIFIED=NO"
            exit 1
          fi
