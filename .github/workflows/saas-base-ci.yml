name: saas-base CI

# Monorepo：只在 saas-base 目录或本 workflow 变更时跑，避免其它子项目改动白烧 CI 分钟。
#
# TEST-INFRA-02: this is a lightweight automatic PR smoke, not the authoritative
# backend regression gate. It only checks that the Python environment installs,
# the app imports, and pytest can collect the suite — fast signal on a broken
# environment/import/collection, nothing more.
#
# Authoritative P0 candidate certification is performed by:
#   Backend Candidate Certification (.github/workflows/backend-candidate-certification.yml)
# Full fallback / serial authoritative run is:
#   Backend Full Certification (.github/workflows/backend-full.yml)
on:
  push:
    branches: [main]
    paths:
      - 'saas-base/**'
      - '.github/workflows/saas-base-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'saas-base/**'
      - '.github/workflows/saas-base-ci.yml'

defaults:
  run:
    working-directory: saas-base

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Test suite is self-contained (aiosqlite in-memory DB); no test connects to a
    # real MySQL/Redis host, so no service containers are needed here.
    #
    # JWT_SECRET_KEY: app/config.py's Settings.model_post_init raises RuntimeError
    # if this is left at its class-default placeholder value. Locally this is
    # overridden by a real value in saas-base/.env, but .env is gitignored and does
    # not exist on a CI checkout. The value below is a CI-only dummy signing key
    # with no relation to any real secret.
    env:
      REDIS_ENABLED: 'false'
      JWT_SECRET_KEY: 'ci-only-dummy-signing-key-not-a-real-secret-0123456789abcdef'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: saas-base/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: App import smoke
        run: python -c "import app; print('APP_IMPORT_OK')"

      - name: Pytest collection smoke
        run: python -m pytest tests/ --collect-only -q
