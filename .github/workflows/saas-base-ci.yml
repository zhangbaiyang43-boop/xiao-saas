name: saas-base CI

# Monorepo：只在 saas-base 目录或本 workflow 变更时跑，避免其它子项目改动白烧 CI 分钟。
on:
  push:
    branches: [main]
    paths:
      - 'saas-base/**'
      - '.github/workflows/saas-base-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'saas-base/**'
      - '.github/workflows/saas-base-ci.yml'

defaults:
  run:
    working-directory: saas-base

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 测试套件自带 aiosqlite 内存库，不依赖真实 MySQL/Redis（本地用无效 DATABASE_URL
    # + REDIS_ENABLED=false 模拟无服务环境，全量 398 passed / 26 failed 与基线一致）。
    # 若将来有测试意外连真实库，再在此处加 service container 或 DATABASE_URL 覆盖。
    env:
      REDIS_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: saas-base/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest
        # pytest 在 26 个已知失败时会 exit 1；baseline 门禁负责判定，此处不因此中断 job。
        run: |
          pytest tests/ -v --tb=short 2>&1 | tee pytest-output.log
          exit 0

      - name: Verify known baseline (398 passed / 26 frontend contract failures)
        run: python scripts/check_pytest_baseline.py pytest-output.log
