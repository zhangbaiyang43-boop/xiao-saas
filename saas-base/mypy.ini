[mypy]
python_version = 3.10
plugins = sqlalchemy.ext.mypy.plugin
follow_imports = silent
warn_return_any = True
warn_unused_ignores = True
no_implicit_optional = True
show_error_codes = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True

files =
    app/services/order_payment_service.py,
    app/services/order_lifecycle_service.py,
    app/services/order_print_service.py,
    app/services/order_stock_service.py,
    app/api/v1/orders.py

# orders.py: only the create_order helper cluster is fully annotated.
[mypy-app.api.v1.orders]
disallow_untyped_defs = False
disallow_incomplete_defs = False
check_untyped_defs = False

[mypy-fastapi.*]
ignore_missing_imports = True

[mypy-pydantic.*]
ignore_missing_imports = True

[mypy-starlette.*]
ignore_missing_imports = True

[mypy-app.*]
follow_imports = silent
